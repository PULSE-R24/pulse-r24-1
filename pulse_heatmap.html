<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE-R24 | Live Geospatial Threat Grid</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090b10;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    
    header {
      padding: 16px 24px;
      background: linear-gradient(135deg, #0A1A44 0%, #1e3a8a 70%, #991b1b 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .header-title h1 {
      font-size: 20px;
      letter-spacing: 1.5px;
      font-weight: 800;
      color: #fff;
    }
    
    .header-title p {
      font-size: 12px;
      color: #cbd5e1;
    }
    
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #34d399;
    }
    
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    
    main {
      padding: 20px;
      max-width: 1280px;
      margin: 0 auto;
    }
    
    .grid-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    
    @media (max-width: 900px) {
      .grid-container { grid-template-columns: 1fr; }
    }
    
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    
    .card-header {
      padding: 14px 18px;
      background: #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #374151;
    }
    
    .card-header h2 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9ca3af;
    }
    
    #map {
      height: 540px;
      width: 100%;
      background: #090b10;
    }
    
    /* OpenStreetMap Dark Radar Invert Policy-safe styling */
    .leaflet-tile-pane {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }
    
    .leaflet-overlay-pane,
    .leaflet-marker-pane,
    .leaflet-popup-pane {
      filter: none !important;
    }
    
    .pulse-marker {
      border-radius: 50%;
      display: block;
      animation: ripple 1.8s infinite ease-out;
    }
    
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    
    .feed-list {
      list-style: none;
      max-height: 540px;
      overflow-y: auto;
      padding: 10px;
    }
    
    .feed-item {
      padding: 12px 14px;
      background: #1e293b;
      margin-bottom: 10px;
      border-radius: 8px;
      border-left: 4px solid #3b82f6;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .feed-item:hover {
      background: #334155;
      transform: translateX(4px);
    }
    
    .feed-item.critical { border-left-color: #ef4444; }
    .feed-item.high { border-left-color: #f97316; }
    .feed-item.medium { border-left-color: #eab308; }
    
    .feed-tag {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }
    
    .feed-tag.critical { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .feed-tag.high { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
    .feed-tag.medium { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    
    .feed-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #f3f4f6;
    }
    
    .feed-meta {
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>RASHTRIYA RAKSHA UNIVERSITY · PULSE-R24</h1>
      <p>Live Geospatial Situational Grid & Threat Heatmap</p>
    </div>
    <div class="status-badge">
      <span class="pulse-dot"></span>
      <span id="alert-counter">ACTIVE SENSORS: 7 NODES</span>
    </div>
  </header>

  <main>
    <div class="grid-container">
      
      <!-- MAP SECTION -->
      <div class="card">
        <div class="card-header">
          <h2>National Radar Threat Heatmap (Zero API Keys)</h2>
          <span style="font-size: 11px; color: #10b981;">● Status: Nominal</span>
        </div>
        <div id="map"></div>
      </div>

      <!-- INTEL FEED LIST -->
      <div class="card">
        <div class="card-header">
          <h2>Active Sensor Intel</h2>
          <span style="font-size: 11px; color: #94a3b8;">Real-Time Feed</span>
        </div>
        <ul class="feed-list" id="feedList"></ul>
      </div>

    </div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet.heat Plugin -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <script>
    // 1. Coordinates dictionary extracted from RRU storageService
    const cityCoords = {
      mumbai: [19.0760, 72.8777],
      delhi: [28.7041, 77.1025],
      bengaluru: [12.9716, 77.5946],
      chennai: [13.0827, 80.2707],
      kolkata: [22.5726, 88.3639],
      hyderabad: [17.3850, 78.4867],
      pune: [18.5204, 73.8567],
      ahmedabad: [23.0225, 72.5714],
      puducherry: [11.9416, 79.8083]
    };

    // 2. Incident intelligence items
    const alerts = [
      { id: 1, city: 'delhi', severity: 'critical', title: 'Critical Infrastructure DDoS Surge', intensity: 1.0, time: '10 mins ago' },
      { id: 2, city: 'mumbai', severity: 'high', title: 'Banking Gateway Anomalous Ingress', intensity: 0.85, time: '22 mins ago' },
      { id: 3, city: 'bengaluru', severity: 'high', title: 'Cloud Tenant API Credential Leak', intensity: 0.8, time: '45 mins ago' },
      { id: 4, city: 'puducherry', severity: 'medium', title: 'Maritime Coastal Sensor Advisory', intensity: 0.6, time: '1 hr ago' },
      { id: 5, city: 'hyderabad', severity: 'medium', title: 'Phishing Campaign Gating Pharma Sector', intensity: 0.6, time: '2 hrs ago' },
      { id: 6, city: 'kolkata', severity: 'medium', title: 'Port Terminal Logistics Latency Spike', intensity: 0.55, time: '3 hrs ago' },
      { id: 7, city: 'pune', severity: 'medium', title: 'Industrial SCADA Probe Detected', intensity: 0.6, time: '4 hrs ago' }
    ];

    // 3. Initialize Leaflet Map centered on India
    const map = L.map('map', {
      center: [22.5937, 78.9629],
      zoom: 5,
      minZoom: 4,
      maxZoom: 10,
      zoomControl: true
    });

    // 4. OpenStreetMap Basemap (100% Free, NO API KEY)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 5. Generate Heatmap Points [lat, lng, intensity]
    const heatPoints = alerts.map(a => {
      const coord = cityCoords[a.city];
      return [coord[0], coord[1], a.intensity];
    });

    // 6. Add Heatmap Layer
    const heat = L.heatLayer(heatPoints, {
      radius: 50,
      blur: 35,
      maxZoom: 8,
      max: 1.0,
      gradient: {
        0.1: '#3b82f6',
        0.3: '#eab308',
        0.5: '#f97316',
        0.7: '#ef4444',
        1.0: '#991b1b'
      }
    }).addTo(map);

    // 7. Add Custom Pulsing Markers for each city
    alerts.forEach(alert => {
      const coord = cityCoords[alert.city];
      const color = alert.severity === 'critical' ? '#ef4444' : (alert.severity === 'high' ? '#f97316' : '#eab308');
      
      const icon = L.divIcon({
        className: 'custom-icon',
        html: `<div style="width:16px; height:16px; background:${color}; border-radius:50%; box-shadow:0 0 12px ${color};">
                 <div class="pulse-marker" style="width:16px; height:16px; background:${color};"></div>
               </div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      const marker = L.marker(coord, { icon: icon }).addTo(map);
      marker.bindPopup(`
        <div style="color: #111; font-family: sans-serif; font-size: 12px;">
          <strong style="color: ${color}; text-transform: uppercase;">[${alert.severity}] ${alert.city}</strong><br/>
          <p style="margin: 4px 0;">${alert.title}</p>
          <small style="color: #666;">Reported: ${alert.time}</small>
        </div>
      `);
    });

    // 8. Render Feed List
    const feedList = document.getElementById('feedList');
    alerts.forEach(alert => {
      const li = document.createElement('li');
      li.className = `feed-item ${alert.severity}`;
      li.innerHTML = `
        <span class="feed-tag ${alert.severity}">${alert.severity}</span>
        <div class="feed-title">${alert.title}</div>
        <div class="feed-meta">📍 ${alert.city.toUpperCase()} · ${alert.time}</div>
      `;
      li.onclick = () => {
        const coord = cityCoords[alert.city];
        map.flyTo(coord, 7, { duration: 1.5 });
      };
      feedList.appendChild(li);
    });
  </script>
</body>
</html>
